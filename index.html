<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5" style="max-width: 500px;">
    <div class="card text-center">
      <div class="card-body">
        <h1 class="card-title mb-4">Weather App</h1>
        <div class="input-group mb-3">
          <input type="text" id="city" class="form-control" placeholder="Enter city name">
          <button class="btn btn-primary" onclick="getWeather()">Search</button>
        </div>
        <div id="result"></div>
      </div>
    </div>
  </div>

  <script>
    async function getWeather() {
      const city = document.getElementById("city").value.trim();
      const result = document.getElementById("result");
      if (city === "") {
        result.innerHTML = '<div class="alert alert-warning">Please enter a city name.</div>';
        return;
      }
      result.innerHTML = '<div class="spinner-border" role="status"></div>';

      try {
        const geoRes = await fetch("https://geocoding-api.open-meteo.com/v1/search?name=" + encodeURIComponent(city) + "&count=1");
        const geo = await geoRes.json();
        if (!geo.results) {
          result.innerHTML = '<div class="alert alert-danger">City not found.</div>';
          return;
        }

        const place = geo.results[0];
        const url = "https://api.open-meteo.com/v1/forecast?latitude=" + place.latitude +
                    "&longitude=" + place.longitude +
                    "&current=temperature_2m,relative_humidity_2m,wind_speed_10m";
        const wRes = await fetch(url);
        const w = await wRes.json();

        result.innerHTML =
          '<div class="card bg-body-tertiary"><div class="card-body">' +
          '<h2 class="h4">' + place.name + ', ' + place.country + '</h2>' +
          '<ul class="list-group list-group-flush">' +
          '<li class="list-group-item">Temperature: ' + w.current.temperature_2m + ' &deg;C</li>' +
          '<li class="list-group-item">Humidity: ' + w.current.relative_humidity_2m + ' %</li>' +
          '<li class="list-group-item">Wind Speed: ' + w.current.wind_speed_10m + ' km/h</li>' +
          '</ul></div></div>';
      } catch (error) {
        result.innerHTML = '<div class="alert alert-danger">Something went wrong. Try again.</div>';
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
